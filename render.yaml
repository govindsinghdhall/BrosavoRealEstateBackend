services:
  - type: web
    name: brisavo-realestate-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: API_BASE_URL
        value: https://brisavorealestatebackend-1.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://brisavorealestatebackend-1.onrender.com/api/v1/marketing/google/callback
      - key: FRONTEND_URL
        value: https://crm.durgaproperty.com
